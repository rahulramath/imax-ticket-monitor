name: Scrape & deploy to GitHub Pages

on:
  schedule:
    # Backstop only. The real cadence comes from the workflow re-triggering
    # itself after each deploy (see "Chain next run" below) — GitHub's cron
    # scheduler is best-effort and in practice skips most 30-min slots. This
    # hourly cron just restarts the chain if a run failed or was never
    # dispatched.
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed for the chain step to dispatch the next run
  actions: write

# Never run two deploys at once; a newer run supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape all theaters
        # Writes public/data/snapshot.json. Fails (skipping deploy, keeping
        # the previous data live) only if every theater failed. The currently
        # deployed snapshot fills any gaps from rate-limited requests.
        env:
          PREV_SNAPSHOT_URL: https://rahulramath.github.io/imax-ticket-monitor/data/snapshot.json
        run: npm run scrape

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          # Email for the "request a theater or movie" link (set in repo
          # Settings -> Secrets and variables -> Actions -> Variables)
          NEXT_PUBLIC_REQUEST_EMAIL: ${{ vars.REQUEST_EMAIL }}
        run: |
          # Project pages live under /<repo-name>; user/org pages at the root
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export BASE_PATH=""
          else
            export BASE_PATH="/$REPO_NAME"
          fi
          # The live-server API route can't be statically exported
          rm -rf src/app/api
          npm run build
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Chain next run
        # Self-perpetuating refresh loop: after a successful deploy, wait a
        # few minutes and dispatch the next run. Combined with the ~10 min a
        # scrape+deploy takes, the site refreshes every ~15-20 minutes —
        # far more reliable than GitHub's best-effort cron. workflow_dispatch
        # via GITHUB_TOKEN is exempt from GitHub's anti-recursion rule, and
        # the concurrency group caps things at one running + one pending run,
        # so overlapping chains (e.g. a push mid-cycle) merge instead of
        # multiplying. Failed runs skip this step; the hourly cron backstop
        # restarts the chain.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
