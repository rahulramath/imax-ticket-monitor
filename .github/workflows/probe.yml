name: Probe (manual diagnostics)

# Run by hand from the Actions tab to check what GitHub's runners can reach.
on:
  workflow_dispatch:
    inputs:
      jump_url:
        description: "Fandango ticketingJumpPageURL for one showtime"
        required: true
      showtime_ids:
        description: "Further Fandango showtime ids to fetch via the seat-map API (space separated)"
        required: false
        default: ""

jobs:
  fandango-seat-map:
    # Several runners (= several IPs) per mode, to measure a pass rate rather
    # than a single lucky or unlucky sample.
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, headed]
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe Fandango seat map (${{ matrix.mode }} #${{ matrix.attempt }})
        env:
          PROBE_HEADED: ${{ matrix.mode == 'headed' && '1' || '0' }}
        run: |
          if [ "$PROBE_HEADED" = "1" ]; then
            xvfb-run -a node scripts/probe-fandango-seats.mjs "${{ inputs.jump_url }}" ${{ inputs.showtime_ids }}
          else
            node scripts/probe-fandango-seats.mjs "${{ inputs.jump_url }}" ${{ inputs.showtime_ids }}
          fi
